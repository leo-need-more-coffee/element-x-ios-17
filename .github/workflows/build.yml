name: Build IPA

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install dependencies
        run: |
          brew install xcodegen
          gem install bundler
          bundle install

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ElementX.xcodeproj \
            -scheme ElementX \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA (unsigned)
        run: |
          mkdir -p build/Payload
          cp -r $(find ~/Library/Developer/Xcode/DerivedData -name "ElementX.app" -type d | head -1) build/Payload/
          cd build
          zip -r ElementX-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ElementX-unsigned
          path: build/ElementX-unsigned.ipa
          retention-days: 7
